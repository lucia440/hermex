{% extends 'base.html'%}

{% block title %}confirmacionPago {% endblock %}

{% block content %}
<vid class="text-center mt-5">
    <h2>¡Gracias por tu compra!</h2>
    <p>Metodo de pago: <strong>{{metodo}}</strong></p>
    <p>Codigo de transaccion: <strong>{{codigo}}</strong></p>
    <p>Total pagado: <strong>${{ "{:,.0f}". format(total)}}</strong></p>
    <a href="{{url_for('catalogo')}}" class="btn btn-success mt-3">Volver al catalogo</a>

</vid>

{% endblock %}
